name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      # The committed fixture must be exactly what the generator produces (once it exists).
      - name: Fixture is reproducible
        run: |
          if [ -f test/fixtures/generate-evening.js ]; then
            npm run fixtures
            git diff --exit-code -- test/fixtures
          fi
